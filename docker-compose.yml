# Full stack: Nginx reverse proxy -> Calculator API.
#   docker compose up -d            # start (uses :latest, builds locally if the image is missing)
#   IMAGE_TAG=42 docker compose up -d   # what Jenkins runs, pinning the image to build #42
name: calculator

services:
  app:
    image: nirbhaysharma504/calculator-api:${IMAGE_TAG:-latest}
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    # No "ports:" on purpose - the API is only reachable through Nginx.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calc-net
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - calc-net
    logging: *default-logging

networks:
  calc-net:
    driver: bridge
