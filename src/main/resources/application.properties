spring.application.name=calculator
# Port comes from the SERVER_PORT environment variable (set in docker-compose.yml), default 8080
server.port=${SERVER_PORT:8080}

# Actuator: only expose what Compose/Jenkins health checks need
management.endpoints.web.exposure.include=health,info
# Return just {"status":"UP"}, without internal details like disk space
management.endpoint.health.show-details=never
# Adds /actuator/health/liveness and /readiness (useful later for Kubernetes probes)
management.endpoint.health.probes.enabled=true
# Publish the info.* properties below at /actuator/info
management.info.env.enabled=true
info.app.name=Calculator REST API
# @project.version@ is replaced by Maven with the <version> from pom.xml at build time
info.app.version=@project.version@

# Graceful shutdown so a redeploy finishes in-flight requests
server.shutdown=graceful
