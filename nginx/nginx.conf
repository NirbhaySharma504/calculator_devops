# Reverse proxy in front of the calculator API.
# Only Nginx is published to the host; the Spring Boot container is reachable
# only on the internal Compose network.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Re-resolving "app" every 10s means that after
    # Jenkins recreates the app container (new IP), Nginx follows it instead
    # of returning 502 to a stale cached IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calculator_upstream http://app:8080;

    # Health of the proxy itself (used by the Compose healthcheck).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass $calculator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
